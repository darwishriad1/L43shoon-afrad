<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>منظومة إدارة الفرد والجاهزية العسكرية</title>
    
    <!-- PWA Primary Meta Tags -->
    <meta name="title" content="منظومة إدارة الفرد والجاهزية العسكرية" />
    <meta name="description" content="نظام متكامل لإدارة وتحضير القوة اليومي، متابعة الحضور والغياب، وتقييم جاهزية الوحدات العسكرية" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="الجاهزية العسكرية" />

    <!-- Favicons & Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body className="bg-slate-900 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('PWA ServiceWorker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('PWA ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
