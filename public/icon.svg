<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Shield Frame -->
  <path d="M 256 70 L 390 120 V 260 C 390 350 256 430 256 430 C 256 430 122 350 122 260 V 120 Z" 
        fill="#0f172a" stroke="url(#gold)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Shield Accent -->
  <path d="M 256 95 L 368 138 V 252 C 368 328 256 398 256 398 C 256 398 144 328 144 252 V 138 Z" 
        fill="none" stroke="url(#emerald)" stroke-width="6" stroke-opacity="0.6" stroke-dasharray="10 6" />

  <!-- Central Emblem - Military Star -->
  <g transform="translate(256, 235)">
    <!-- Star Rays -->
    <circle r="65" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.4" />
    
    <!-- Central Star -->
    <polygon points="0,-60 16,-18 58,-18 24,8 37,50 0,24 -37,50 -24,8 -58,-18 -16,-18" fill="url(#gold)" />

    <!-- Center Insignia / Checkmark -->
    <circle r="22" fill="#0b1329" stroke="url(#gold)" stroke-width="3" />
    <path d="M -8 1 L -2 7 L 10 -5" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title Ribbon Text Graphics -->
  <path d="M 170 360 Q 256 380 342 360" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Top Laurel Dots -->
  <circle cx="256" cy="115" r="5" fill="#f59e0b" />
  <circle cx="236" cy="120" r="4" fill="#f59e0b" opacity="0.8" />
  <circle cx="276" cy="120" r="4" fill="#f59e0b" opacity="0.8" />
</svg>
